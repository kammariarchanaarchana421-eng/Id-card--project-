<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>My College Id Card</title>
</head>

<body>
  <div class="card-container">
  <div class="id-card">
<header class="card-header">
                <img src="image1.jpg" class="logo" />
                <p>Pragnya Degree College</p>
            </header>
               <div class="photo-wrap">
                <img src="image2.jpg" class="photo" alt="Profile Photo" width="120">
            </div>

            <main class="card-body">
                <div class="section">
                    <h2class="student-name">Madhumitha</h2>
                    <p class="college">Pragnya Degree College</p>
                </div>
  <hr class="divider">

                <div class="details">
                    <p>
                        <strong>Course</strong>
                        BCA
                    </p>

                    <p>
                        <strong>BirthDate</strong>
                        23-03-2004
                    </p>
                </div>

                <div class="id-line">
                    <span class="id-label">ID No.</span>
                    <span class="id-value">124124861001</span>
                </div>
 <div class="barcode">
                </div>
            </main>

            <footer class="card-footer">
                <p class="footer-text">Issued By:Pragnya Degree College</p>
            </footer>
        </div>
    </div>
</body>
</html>
